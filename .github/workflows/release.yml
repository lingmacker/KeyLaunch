name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build app
        run: make build-app CONFIGURATION=Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package app
        run: |
          mkdir -p dist/release
          ditto -c -k --keepParent ".build/DerivedData/Build/Products/Release/KeyLaunch.app" "dist/release/KeyLaunch-${GITHUB_REF_NAME}.zip"

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: dist/release/KeyLaunch-${{ github.ref_name }}.zip
          generate_release_notes: true
