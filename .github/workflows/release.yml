name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build app
        run: make build-app CONFIGURATION=Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package app
        run: |
          mkdir -p dist/release
          ditto -c -k --keepParent ".build/DerivedData/Build/Products/Release/KeyLaunch.app" "dist/release/KeyLaunch-${GITHUB_REF_NAME}.zip"

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/release/KeyLaunch-${{ github.ref_name }}.zip
          generate_release_notes: true
